{% extends "base.html" %}
{% load tag_utils %}
{% load static %}

{% block title %}
    {{ view.title }}
{% endblock %}

{% block content %}
    <h1>{{ view.title }}</h1>
    <dl>
        {% for field in fields %}
            <dt>{{ field.verbose_name }}</dt>
            <dd>{{ object|get_attr:field.name }}</dd>
        {% endfor %}
    </dl>
    <a href="/" class="btn btn-primary">Volver</a>
{% endblock %}
